<script>
/* =========================================================================
   抜刀 — 居合特化型アクション  v0.2
   企画書『抜刀』（C:\Users\owner\Downloads\ゲーム企画書.md）の実装。

   v0.1（手触りプロトタイプ）からの主な変更 — 本人の指摘3点への対処:
     ・抜刀が弱い      → 刀身をバネ質点にして「刃筋」を実装。刀を横に払った速さで
                          斬れ方が変わる。連撃・強斬・抜き付けの薙ぎを追加した。
     ・防御が弱い      → 受け／弾き（パリィ）の二層構造へ。上中下段の読み、
                          朱撃（鞘では受けられない）、弾き後の「後の先」。
     ・洗練されていない → ヒットストップ・スロー・カメラ・粒子・斬痕・背景5種・
                          ラン進行（5面＋果たし合い）・強化選択・結果画面。
   ========================================================================= */

/* ===== ① チューニング（ここだけ触れば手触りが全部変わる）================= */
const T = {
  /* --- 刀3本。企画書 §11-12 のトレードオフをそのまま数値にした --- */

      txt:'速い。何度も抜いて納める型。一撃は軽い。' },

      lat:24, mouthR:28, ang:46, mass:1.0,

  ],

  react: [

  straightBonus:[0.85,1.32],  // 抜刀軌道のブレ→倍率

  strokeFast:0.42,

  reachMul:1.7, reachAdd:78,  // 抜き付けの間合い = L*1.7 + 78

  /* --- 刀身の物理（ここが「刃筋」の根っこ）--- */
  bladeK:0.30,                // 距離拘束のバネ定数。上げると刀が硬くなる
  bladeDamp:0.855,            // 減衰。下げるとよく振り回される
  bladeMax:1.30, bladeMin:0.52,

  /* --- 通常斬撃：刀を「横に払った速さ」＝刃筋で決まる（企画書 §8）--- */

    { v: 560, n:'浅',  m:0.50, hs:0.00 },

  ],

  comboWindow:1.35,           // 連撃が途切れるまで

  guardArcSheath:58,          // 鞘受けの角度許容（甘い）
  guardArcBlade:44,           // 刃受けの角度許容（狭い）

  parryIaiCut:0.35,           // 弾き後3秒以内の居合構えは待機がこれだけ縮む

/* ===== ② 座標系・時間・カメラ ============================================ */
const VW=1280, VH=720, GY=566;
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const scrEl=document.getElementById('scr');
let sc=1, ox=0, oy=0, dpr=1;
function layout(){
  dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,innerWidth*dpr); cv.height=Math.max(1,innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  sc=Math.min(innerWidth/VW, innerHeight/VH)||1;
  ox=(innerWidth-VW*sc)/2; oy=(innerHeight-VH*sc)/2;
}
addEventListener('resize',layout); layout();

const PX=352, PY=436;                  // プレイヤーの腰
const M={x:394,y:458};                 // 鯉口
const DA=172*Math.PI/180;              // 鞘の向き（口→鐺）
const dx=Math.cos(DA), dy=Math.sin(DA);
const ux=-dx, uy=-dy;                  // 抜く向き

const dot=(ax,ay,bx,by)=>ax*bx+ay*by;
const crs=(ax,ay,bx,by)=>ax*by-ay*bx;
const len=(x,y)=>Math.hypot(x,y);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function angDiff(a,b){let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d;}
function segDist(ax,ay,bx,by,px,py){
  const vx=bx-ax, vy=by-ay, l2=vx*vx+vy*vy;
  const t=l2?clamp(((px-ax)*vx+(py-ay)*vy)/l2,0,1):0;
  return Math.hypot(px-(ax+vx*t), py-(ay+vy*t));
}
const cam={sh:0, zoom:1, zx:VW/2, zy:VH/2};
let hitstop=0, slowT=0, slowS=1;
function shake(v){ cam.sh=Math.min(24,cam.sh+v); }
function freeze(s){ hitstop=Math.max(hitstop,s); }
function slow(s,scale){ slowT=Math.max(slowT,s); slowS=scale; }

/* ===== ③ 音 — 素材ゼロ。全部その場で合成 ================================= */
let AC=null, NB=null, MASTER=null;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=0.9; MASTER.connect(AC.destination);
  }
  return AC;
}
function noise(){
  const a=ac(); if(NB) return NB;
  NB=a.createBuffer(1,a.sampleRate,a.sampleRate);
  const d=NB.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return NB;
}
function tone(f,dur,type,vol,f2,delay){
  const a=ac(), o=a.createOscillator(), gn=a.createGain(), t=a.currentTime+(delay||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(vol,t+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn).connect(MASTER); o.start(t); o.stop(t+dur+.02);
}
function nz(dur,vol,type,f,q,f2,delay){
  const a=ac(), s=a.createBufferSource(), bp=a.createBiquadFilter(), gn=a.createGain();
  const t=a.currentTime+(delay||0);
  s.buffer=noise(); s.loop=true;
  bp.type=type||'bandpass'; bp.frequency.setValueAtTime(f,t); bp.Q.value=q||1;
  if(f2) bp.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+dur);
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(vol,t+0.006);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp).connect(gn).connect(MASTER); s.start(t); s.stop(t+dur+.02);
}
const S={
  chin:  ()=>{ tone(2150,.085,'triangle',.10); tone(3200,.055,'sine',.05); },
  koi:   ()=>{ tone(1650,.06,'triangle',.07); nz(.04,.06,'bandpass',2600,3); },
  draw:  ()=>{ nz(.30,.19,'bandpass',820,1.0,5200); nz(.10,.09,'highpass',3000,.8); },

  parry: ()=>{ tone(3100,.42,'sine',.20,2900); tone(4400,.30,'sine',.12);

  katsu: ()=>{ nz(.05,.19,'bandpass',740,3.4); tone(420,.045,'square',.07); },
  su:    ()=>{ nz(.08,.042,'lowpass',1100,.7); },
  kachin:()=>{ tone(3050,.05,'square',.14); tone(4250,.04,'sine',.09);

  hurt:  ()=>{ nz(.22,.27,'lowpass',400,.9); tone(70,.24,'sine',.23,38); },
  down:  ()=>{ tone(185,.60,'sawtooth',.13,40); nz(.40,.14,'lowpass',680,.8);
               tone(92,.5,'sine',.16,44,.05); },
  win:   ()=>{ [0,.09,.2].forEach((d,i)=>tone([523,659,880][i],.5,'sine',.11,null,d)); },
  lose:  ()=>{ tone(150,1.1,'sine',.16,60); nz(.7,.10,'lowpass',300,.7); },
  step:  ()=>{ nz(.05,.03,'lowpass',280,1); },
  ui:    ()=>{ tone(1400,.05,'triangle',.06); },
  boss:  ()=>{ tone(60,1.4,'sine',.24,44); tone(90,1.0,'sawtooth',.07,60); },
};

/* ===== ④ 入力 ============================================================ */
const mouse={x:M.x,y:M.y,L:false,R:false,rAt:-9};
function toV(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left-ox)/sc, y:(e.clientY-r.top-oy)/sc };
}
addEventListener('mousemove',e=>{const p=toV(e); mouse.x=p.x; mouse.y=p.y;});
addEventListener('mousedown',e=>{
  if(e.button===0) mouse.L=true;
  if(e.button===2){ mouse.R=true; mouse.rAt=RT; }
});
addEventListener('mouseup',e=>{ if(e.button===0)mouse.L=false; if(e.button===2)mouse.R=false; });
addEventListener('contextmenu',e=>e.preventDefault());
const keys={};
addEventListener('keydown',e=>{
  if(e.code==='Space') e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='KeyG') st.guide=!st.guide;
    if(e.code==='KeyR' && (st.phase==='dead'||st.phase==='clear')) newRun(st.swordIdx);
  }
  keys[e.code]=true;
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{ for(const k in keys)keys[k]=false; mouse.L=mouse.R=false; });

/* ===== ⑦ 走っている状態 ================================================== */
const st = { phase:'title', guide:true, t:0, fightT:0, stun:0, combo:0, msgT:0, bannerT:0 };
let RT = 0;   // 実時間（スロー・ヒットストップの影響を受けない。反応計測はこれ）

function newRun(swIdx){
  const sw=T.swords[swIdx];
  Object.assign(st,{
    phase:'fight', swordIdx:swIdx, sw, L:sw.L,
    mod:baseMod(sw),
    stage:0, fight:0, kills:0, score:0, best:null, bestTier:null,
    parries:0, iaiHits:0, cuts:0, dmgTaken:0, startRT:RT,
    hp:T.playerHP, maxhp:T.playerHP,
    t:0, guide:st.guide,
  });
  resetSword(); clearFx(); startFight();
  hideScreen();
}
function resetSword(){
  const e=E();
  Object.assign(st,{
    mode:'SHEATHED', s:0, grabX:0, grabY:0, drawErr:0, drawN:0, bind:0, drawT0:0,
    tipX:e.x, tipY:e.y, hiltX:M.x, hiltY:M.y, hvx:0, hvy:0, pmx:0, pmy:0,
    q:0, sheStep:0, slice:0, sliceP:0, sh:[], axial:0, ptx:0, pty:0,
    iai:false, iaiT:0, iaiWait:0, zan:false, zanAt:0, early:false,
    combo:0, comboT:0, cutAt:-9, cutLatch:false,
    stun:0, guardAng:0, guarding:false, gTier:0,
    parryAt:-9, trail:[], msg:null, msgT:0, banner:null, bannerT:0,
  });
}
function E(){ return {x:M.x+dx*st.L, y:M.y+dy*st.L}; }

function startFight(){
  const stage=RUN[st.stage], id=stage.fights[st.fight];
  const d=EN[id];
  const hard=1+st.stage*0.06;
  st.bg=BG[stage.bg]; ambInit();   // 面ごとに天候を張り替える
  st.enemy={
    /* 間合いの少し外から入ってくる。画面端から歩かせると開幕が8秒かかって間延びした */
    id, def:d, hp:d.hp*hard, max:d.hp*hard, x:Math.min(1210, PX+d.ma+(d.boss?300:235)), y:PY,
    state:'walk', t:0, tel:0, phi:0, kind:0, red:false, feinted:false,
    chainLeft:0, stagger:0, dead:0, flash:0, lean:0,
    bmode:'SHEATHED', bq:0, bwait:0, bzan:false, phase:1,
  };
  resetSword();
  st.banner=stage.n+'　'+d.n; st.bannerT=2.4; st.fightT=0;
  if(d.boss) S.boss();
}

/* ===== ⑧ 演出（粒子・斬痕・浮き文字）===================================== */
let PT=[], SL=[], FL=[], AMB=[];
function clearFx(){ PT=[]; SL=[]; FL=[]; AMB=[]; }
function spark(x,y,n,col,pw){
  for(let i=0;i<n;i++){
    const a=rnd(0,6.283), v=rnd(60,340)*(pw||1);
    PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:rnd(.22,.55),m:0,c:col||'#ffe6b8',r:rnd(1,2.6),g:520});
  }
}
function mist(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=rnd(-2.6,-0.5), v=rnd(30,150);
    PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,.9),m:0,c:col||'rgba(190,60,48,',r:rnd(2,5.5),g:180,soft:1});
  }
}
function slash(x1,y1,x2,y2,w,col,life,cx,cy){
  if(cx===undefined){ /* 制御点が無ければ弦の法線側へ少し膨らませる */
    const mx=(x1+x2)/2,my=(y1+y2)/2, nx=-(y2-y1),ny=(x2-x1), nl=Math.hypot(nx,ny)||1;
    cx=mx+nx/nl*Math.min(90,nl*0.18); cy=my+ny/nl*Math.min(90,nl*0.18);
  }
  SL.push({x1,y1,x2,y2,cx,cy,w:w||10,c:col||'#fff6e6',l:life||0.26,m:life||0.26});
}
function fly(txt,x,y,col,big){ FL.push({t:txt,x,y,c:col||'#e6dcc8',l:1.0,m:1.0,b:big?1:0,vy:-46}); }
function say(t,c){ st.msg=t; st.msgC=c||'#d8ccb4'; st.msgT=1.2; }

function ambInit(){
  AMB=[];
  const k=st.bg&&st.bg.pt;
  if(!k||k==='none') return;
  const n = k==='rain'?150 : k==='snow'?110 : k==='leaf'?38 : 46;
  for(let i=0;i<n;i++) AMB.push(ambNew(k,true));
}
function ambNew(k,init){
  const y=init?rnd(-40,VH):-30;
  if(k==='rain')  return {k,x:rnd(-100,VW+100),y,vx:-180,vy:900,l:rnd(12,26)};
  if(k==='snow')  return {k,x:rnd(0,VW),y,vx:rnd(-22,10),vy:rnd(28,64),r:rnd(1,2.6),p:rnd(0,6.3)};
  if(k==='leaf')  return {k,x:rnd(0,VW),y,vx:rnd(-40,-10),vy:rnd(24,50),r:rnd(3,6),a:rnd(0,6.3),va:rnd(-2,2)};
  return {k:'ash',x:rnd(0,VW),y,vx:rnd(-16,16),vy:rnd(10,30),r:rnd(.8,2),p:rnd(0,6.3)};
}
function fxUpdate(dt){
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i]; p.l-=dt; if(p.l<=0){PT.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.vx*=0.985;
  }
  for(let i=SL.length-1;i>=0;i--){ SL[i].l-=dt; if(SL[i].l<=0)SL.splice(i,1); }
  for(let i=FL.length-1;i>=0;i--){ const f=FL[i]; f.l-=dt; f.y+=f.vy*dt; f.vy*=0.94; if(f.l<=0)FL.splice(i,1); }
  for(let i=0;i<AMB.length;i++){
    const a=AMB[i]; a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.k==='snow'||a.k==='ash'){ a.p+=dt*2; a.x+=Math.sin(a.p)*12*dt; }
    if(a.k==='leaf'){ a.a+=a.va*dt; a.x+=Math.sin(a.a)*20*dt; }
    if(a.y>VH+40||a.x<-140||a.x>VW+140) AMB[i]=ambNew(a.k,false);
  }
}

/* ===== ⑨ ダメージと判定 ================================================== */
function tierOf(rt){ for(const r of T.react) if(rt<=r.t) return r; return T.react[T.react.length-1]; }

function damage(v,tag,col,big){
  const e=st.enemy; if(!e||e.dead>0) return 0;
  v=Math.round(v);
  const dealt=Math.min(v, Math.max(0,e.hp));   // 過剰damageを得点に数えない
  e.hp-=v; e.flash=1;
  fly(tag+' '+v, e.x+rnd(-26,26), e.y-84+rnd(-14,14), col, big);
  st.score+=dealt;
  if(e.hp<=0){
    e.hp=0; e.dead=0.9; S.down();
    mist(e.x,e.y-30,26); spark(e.x,e.y-30,16,'#e8d8b8',.7);
    slow(st.mod.zanshin, T.zanshinScale);
    say('残心','#cfe0d8');
    st.kills++; st.score+=140;
  }
  return v;
}
function playerHurt(v){
  st.hp-=v; st.dmgTaken+=v; S.hurt(); shake(14); freeze(T.hsHurt);
  mist(PX+30,PY-20,10,'rgba(200,70,54,');
  fly('-'+v, PX+20, PY-70, '#e0866c');
  if(st.hp<=0){ st.hp=0; die(); }
}

/* 敵の攻撃が着弾する瞬間。ここが防御システムの本体 */
function resolveAttack(){
  const e=st.enemy, m=st.mod;
  const gx=PX+Math.cos(e.phi)*T.guardPointDist, gy=PY+Math.sin(e.phi)*T.guardPointDist;
  const sheathed = st.mode==='SHEATHED';
  const drawn    = st.mode==='DRAWN';
  let ok=false, parry=false, how='';

  if(mouse.R && (sheathed||drawn)){
    const a=Math.atan2(mouse.y-PY, mouse.x-PX);
    const arc=(sheathed?T.guardArcSheath:T.guardArcBlade)*Math.PI/180;
    const aimed=Math.abs(angDiff(a,e.phi))<arc;
    /* 朱撃は鞘では受けられない（企画書 §17 の巌） */
    const canTake = !(e.red && sheathed);
    if(aimed&&canTake){
      ok=true;
      parry = (RT-mouse.rAt) <= m.parry;
      how = sheathed?'鞘受け':'刃受け';
    } else if(aimed&&!canTake){ how='朱撃'; }
  }
  /* 抜刀中・納刀中は受けられない ＝ 納刀は隙（企画書 §10）*/

  if(ok&&parry){
    S.parry(); freeze(T.hsParry); shake(9);
    spark(gx,gy,26,'#dff0ff',1.25); slash(gx-40,gy-40,gx+40,gy+40,5,'#dff0ff',.2);
    e.stagger=T.staggerParry; e.chainLeft=0;
    st.parryAt=RT; st.parries++; st.score+=90;
    fly('弾き', gx, gy-26, '#bfe3ff', 1);
  } else if(ok){
    S.guard(); shake(5);
    spark(gx,gy,10,'#cfe0ff',.7);
    e.stagger=T.staggerGuard;
    const chip=Math.round((sheathed?T.chipSheath:T.chipBlade)*st.mod.chip);
    if(chip>0){ st.hp-=chip; st.dmgTaken+=chip; fly('-'+chip,gx,gy-22,'#9fb4c8'); if(st.hp<=0){st.hp=0;die();return;} }
    fly(how, gx, gy-40, '#cfe0ff');
  } else {
    let dmg=e.def.dmg*(1+st.stage*0.05);
    if(st.mode==='DRAWN'||st.mode==='DRAWING') dmg*=T.drawnTake;
    if(how==='朱撃'){ dmg*=1.15; say('朱撃は鞘では受けられない','#e07a5c'); }
    if(st.mode==='SHEATHING'){ popOut(); say('納刀を崩された','#e0866c'); }
    playerHurt(Math.round(dmg));
    st.combo=0;
  }
}

/* 抜き付け（居合／通常抜刀）*/
function fireDraw(){
  const e=st.enemy, m=st.mod;
  const reach = st.L*T.reachMul + T.reachAdd + m.reach;
  const inRange = e && e.dead<=0 && (e.x-PX)<reach;
  const strokeSec = Math.max(0.001, RT-st.drawT0);
  const spd = clamp(m.strokeFast/strokeSec,0,1);
  const sb  = lerp(T.strokeBonus[0],T.strokeBonus[1],spd);
  S.draw();
  /* 抜き付けの弧。腰から起こして敵の胴を抜ける */
  const x2=PX+reach, y2=PY-96;
  slash(M.x-26, M.y+34, x2, y2, 20, '#fff8ec', .30, PX+reach*0.42, PY+64);
  slash(M.x-10, M.y+18, x2-24, y2+18, 8, '#cfe6ff', .24, PX+reach*0.44, PY+44);
  cam.zoom=1.045; cam.zx=PX+reach*0.4; cam.zy=PY-40;

  if(st.iai && st.zan && !st.early){
    const rt = RT-st.zanAt;
    const tier = tierOf(rt);
    const err = st.drawN? st.drawErr/st.drawN : 0;
    const stb = lerp(T.straightBonus[1],T.straightBonus[0], clamp(err/m.lat,0,1));
    let mul = tier.m + (tier.m>=2?m.react:0);
    if(e && e.dead<=0){
      if(e.hp>=e.max-0.01) mul*=1+m.fullHP;              // 一刀両断
      if(e.state==='tel')  mul*=1+m.senno;               // 先の先
    }
    const dmg = st.sw.iai*mul*stb*sb;
    if(!st.best||rt<st.best){ st.best=rt; st.bestTier=tier.n; }
    if(inRange){
      S.iai(); freeze(T.hsIai); slow(T.slowIai[0],T.slowIai[1]); shake(17);
      spark(e.x-20,e.y-40,30,tier.c,1.3); mist(e.x-10,e.y-34,20);
      damage(dmg, tier.n+' 居合', tier.c, 1);
      st.iaiHits++;
      fly('×'+(mul*stb*sb).toFixed(2)+'　'+rt.toFixed(3)+'s', PX+250, PY-150, tier.c);
    } else {
      say('空振り（間合いの外）','#7d746a'); shake(4);
    }
  } else {
    const p = st.early?T.earlyPenalty:1;
    if(st.early){ st.stun=T.earlyStun; say('早抜き','#c9603f'); shake(3); }
    if(inRange){ S.cut(.4); damage(st.sw.iai*0.34*p*sb, st.early?'早抜き':'抜き付け','#b9b0a0'); }
  }
  st.iai=false; st.zan=false; st.early=false;
}

function popOut(){
  st.mode='DRAWN'; S.katsu(); shake(3);
  st.tipX=M.x+dx*st.L*st.q; st.tipY=M.y+dy*st.L*st.q;
  st.hiltX=st.tipX-dx*st.L; st.hiltY=st.tipY-dy*st.L;
  st.hvx=st.hvy=0; st.q=0; st.sheStep=0;
}

/* ===== ⑩ 敵AI ============================================================ */
function enemyUpdate(dt){
  const e=st.enemy; if(!e) return;
  if(e.dead>0){
    e.dead-=dt;
    if(e.dead<=0) nextFight();
    return;
  }
  e.flash=Math.max(0,e.flash-dt*4);
  if(e.stagger>0){ e.stagger-=dt; e.lean=lerp(e.lean,6,dt*8); return; }
  e.lean=lerp(e.lean,0,dt*6);
  e.t+=dt;
  if(e.def.boss){ bossUpdate(dt); return; }

  const d=e.x-PX;
  if(e.state==='walk'){
    if(d>e.def.ma){ e.x-=e.def.sp*dt; if(Math.random()<dt*6) S.step(); }
    else { e.state='ready'; e.t=0; }
  } else if(e.state==='ready'){
    if(e.t> rnd(0.22,0.62)) beginAtk();
  } else if(e.state==='tel'){
    if(e.def.feint && !e.feinted && e.t>e.tel*e.def.feint){
      e.feinted=true; e.kind=(e.kind+1+((Math.random()*2)|0))%3; e.phi=ATT[e.kind].phi;
      S.koi();
    }
    if(e.t>=e.tel){ resolveAttack(); afterAtk(); }
  } else if(e.state==='rec'){
    if(e.t>e.def.rec){ e.state='walk'; e.t=0; }
  }
}
function beginAtk(){
  const e=st.enemy;
  e.state='tel'; e.t=0; e.feinted=false;
  e.kind=(Math.random()*3)|0; e.phi=ATT[e.kind].phi;
  e.red = e.def.red>0 && Math.random()<e.def.red;
  e.tel = e.def.tel*rnd(0.86,1.16)*st.mod.tel;
  if(e.chainLeft<=0) e.chainLeft=e.def.chain;
  S.koi();
}
function afterAtk(){
  const e=st.enemy;
  e.chainLeft--;
  if(e.chainLeft>0 && e.stagger<=0){ e.state='tel'; e.t=0;
    e.kind=(e.kind+1+((Math.random()*2)|0))%3; e.phi=ATT[e.kind].phi;
    e.red=e.def.red>0&&Math.random()<e.def.red*0.5;
    e.tel=e.def.tel*rnd(0.62,0.82)*st.mod.tel; S.koi();
  } else { e.state='rec'; e.t=0; }
}

/* ラスボス『無銘』— プレイヤーと同じ型（企画書 §19）*/
function bossUpdate(dt){
  const e=st.enemy;
  const ph = e.hp/e.max>0.6?1 : e.hp/e.max>0.28?2 : 3;
  if(ph!==e.phase){ e.phase=ph; say(['','','二の太刀','奥義'][ph],'#e8cfa4'); S.boss(); shake(10); }
  const d=e.x-PX;

  if(e.bmode==='SHEATHED'){
    /* 納刀している間は居合を狙っている */
    if(d>e.def.ma){ e.x-=e.def.sp*dt*0.7; return; }
    if(e.state!=='iai'){ e.state='iai'; e.t=0; e.bwait=rnd(1.4,2.7)/(1+0.18*(ph-1)); e.bzan=false; S.chin(); }
    if(!e.bzan && e.t>=e.bwait){ e.bzan=true; e.bzanAt=0; S.zan(); shake(6); }
    if(e.bzan){
      e.bzanAt+=dt;
      if(e.bzanAt>0.42){
        /* 抜き付け — 受けられるが、外すと重い */
        e.phi=ATT[e.kind=(Math.random()*3)|0].phi; e.red=false;
        resolveAttack();
        slash(e.x+40,e.y-40, PX-40, PY-70, 14,'#ffe9c4',.3);
        S.iai(); shake(15); freeze(0.06);
        e.bmode='DRAWN'; e.state='rec'; e.t=0; e.chainLeft=0; e.bzan=false;
      }
    }
    return;
  }
  /* 抜刀している間は通常の型で押してくる。数回斬ったら納刀する＝こちらの好機 */
  if(e.state==='walk'){
    if(d>e.def.ma*0.82){ e.x-=e.def.sp*dt; } else { e.state='ready'; e.t=0; }
  } else if(e.state==='ready'){
    if(e.t>rnd(0.2,0.5)){
      if(e.atkDone>=2+ph){ e.state='sheathe'; e.t=0; e.atkDone=0; S.su(); }
      else beginAtk();
    }
  } else if(e.state==='tel'){
    if(!e.feinted && e.t>e.tel*e.def.feint){ e.feinted=true; e.kind=(e.kind+1)%3; e.phi=ATT[e.kind].phi; S.koi(); }
    if(e.t>=e.tel){ resolveAttack(); e.atkDone=(e.atkDone||0)+1; afterAtk(); }
  } else if(e.state==='rec'){
    if(e.t>e.def.rec*(ph===3?0.72:1)){ e.state='walk'; e.t=0; }
  } else if(e.state==='sheathe'){
    e.bq=clamp(e.t/0.9,0,1);
    if(e.t>0.9){ e.bmode='SHEATHED'; e.state='walk'; e.t=0; e.bq=0; S.kachin(); }
  }
}

function nextFight(){
  const stage=RUN[st.stage];
  st.fight++;
  if(st.fight>=stage.fights.length){
    st.stage++; st.fight=0;
    if(st.stage>=RUN.length){ clearRun(); return; }
  }
  st.enemy=null; st.phase='upgrade'; showUpgrade();
}
function die(){
  st.phase='dead'; S.lose(); slow(1.6,0.22); shake(20);
  setTimeout(showResult,900);
}
function clearRun(){
  st.phase='clear'; S.win(); slow(2.4,0.3);
  setTimeout(showResult,1100);
}

/* ===== ⑪ 更新 ============================================================ */
function update(dt){
  st.t+=dt; st.fightT+=dt;
  cam.sh=Math.max(0,cam.sh-dt*40);
  cam.zoom=lerp(cam.zoom,1,dt*4);
  st.msgT=Math.max(0,st.msgT-dt);
  st.bannerT=Math.max(0,st.bannerT-dt);
  fxUpdate(dt);
  if(st.stun>0) st.stun-=dt;
  if(st.combo>0){ st.comboT-=dt; if(st.comboT<=0) st.combo=0; }
  if(st.phase!=='fight') return;
  enemyUpdate(dt);
  if(st.phase!=='fight') return;

  const m=st.mod;
  st.guarding = mouse.R && (st.mode==='SHEATHED'||st.mode==='DRAWN');
  if(st.guarding) st.guardAng=Math.atan2(mouse.y-PY, mouse.x-PX);

  /* --- 居合構え（企画書 §4）--- */
  const canIai = st.mode==='SHEATHED' && st.stun<=0 && !st.guarding;
  if(keys['Space'] && canIai){
    if(!st.iai){
      st.iai=true; st.zan=false; st.iaiT=0;
      let wmin=Math.max(0.6,m.waitMin), wmax=Math.max(wmin+0.4,m.waitMax);
      let w=lerp(wmin,wmax,Math.random());
      if(RT-st.parryAt < T.parryIaiWindow) w*=(1-T.parryIaiCut-m.gono);   // 後の先
      st.iaiWait=Math.max(0.35,w); S.chin();
    }
    st.iaiT+=dt;
    if(!st.zan && st.iaiT>=st.iaiWait){
      st.zan=true; st.zanAt=RT; S.zan(); shake(5); cam.zoom=1.05; cam.zx=VW/2; cam.zy=VH/2-40;
    }
  } else if(st.iai && st.mode==='SHEATHED' && (!keys['Space']||st.guarding)){
    st.iai=false; st.zan=false;
  }

  const e0=E();

  /* --- SHEATHED --- */
  if(st.mode==='SHEATHED'){
    st.tipX=e0.x; st.tipY=e0.y; st.hiltX=M.x; st.hiltY=M.y;
    if(mouse.L && st.stun<=0 && !st.guarding){
      st.mode='DRAWING'; st.s=0; st.grabX=mouse.x; st.grabY=mouse.y;
      st.drawErr=0; st.drawN=0; st.bind=0; st.drawT0=RT;
      st.early = st.iai && !st.zan;
      S.koi();
    }
  }

  /* --- DRAWING：鞘の軸に沿って引く --- */
  else if(st.mode==='DRAWING'){
    const rx=mouse.x-st.grabX, ry=mouse.y-st.grabY;
    const along=dot(rx,ry,ux,uy), lat=Math.abs(crs(rx,ry,ux,uy));
    st.drawErr+=lat; st.drawN++;
    if(lat>st.mod.lat){
      st.bind-=dt; if(st.bind<=0){ S.katsu(); st.bind=.20; }
    } else {
      st.s=Math.max(st.s, clamp(along,0,st.L));
    }
    const sx=ux*st.s, sy=uy*st.s;
    st.hiltX=M.x+sx; st.hiltY=M.y+sy; st.tipX=e0.x+sx; st.tipY=e0.y+sy;
    if(st.s>=st.L-5){
      st.mode='DRAWN';
      st.tipX=mouse.x; st.tipY=mouse.y;
      st.hiltX=st.tipX+dx*st.L; st.hiltY=st.tipY+dy*st.L;
      st.hvx=st.hvy=0; st.pmx=(st.hiltX+st.tipX)/2; st.pmy=(st.hiltY+st.tipY)/2;
      st.trail.length=0;
      fireDraw();
    } else if(!mouse.L){ st.mode='SHEATHED'; st.s=0; S.su(); }
  }

  /* --- DRAWN：刀身はバネ質点。振ると遅れて追ってくる ＝ 刃筋が生まれる --- */
  else if(st.mode==='DRAWN'){
    st.tipX=mouse.x; st.tipY=mouse.y;

    if(st.guarding){
      /* 受け構え：刀を構えに固定する。振れない＝これが抜刀ガードの代償 */
      const ga=st.guardAng;
      const px2=PX+Math.cos(ga)*T.guardPointDist, py2=PY+Math.sin(ga)*T.guardPointDist;
      const na=ga+Math.PI/2;
      st.hiltX=lerp(st.hiltX,px2-Math.cos(na)*st.L*0.5,0.35);
      st.hiltY=lerp(st.hiltY,py2-Math.sin(na)*st.L*0.5,0.35);
      st.tipX =lerp(mouse.x, px2+Math.cos(na)*st.L*0.5,0.55);
      st.tipY =lerp(mouse.y, py2+Math.sin(na)*st.L*0.5,0.55);
      st.hvx=st.hvy=0; st.slice=0; st.sliceP=0; st.sh.length=0;
    } else {
      /* 距離拘束のバネ＋減衰 */
      let hx=st.hiltX-st.tipX, hy=st.hiltY-st.tipY;
      let hd=len(hx,hy)||0.001;
      const err=hd-st.L;
      const f=clamp(dt*60,0.25,2.2);
      const k=(T.bladeK/st.sw.mass)*f;
      st.hvx-=(hx/hd)*err*k; st.hvy-=(hy/hd)*err*k;
      const dmp=Math.pow(T.bladeDamp,f);
      st.hvx*=dmp; st.hvy*=dmp;
      st.hiltX+=st.hvx*f; st.hiltY+=st.hvy*f;
      hx=st.hiltX-st.tipX; hy=st.hiltY-st.tipY; hd=len(hx,hy)||0.001;
      const lo=st.L*T.bladeMin, hi=st.L*T.bladeMax;
      if(hd>hi||hd<lo){
        const d2=clamp(hd,lo,hi);
        st.hiltX=st.tipX+hx/hd*d2; st.hiltY=st.tipY+hy/hd*d2;
      }
      /* 手首 — 鯉口の近くでだけ刃が鞘へ向く（無いと180°振り戻す弧が要る） */
      const nr=1-clamp(len(st.tipX-M.x,st.tipY-M.y)/(st.mod.mouth*T.sheatheAssistR),0,1);
      if(nr>0 && T.sheatheAssist>0){
        const ba=Math.atan2(st.hiltY-st.tipY, st.hiltX-st.tipX);
        const na=ba+clamp(angDiff(Math.atan2(uy,ux),ba),-1,1)*nr*T.sheatheAssist;
        st.hiltX=st.tipX+Math.cos(na)*st.L; st.hiltY=st.tipY+Math.sin(na)*st.L;
        st.hvx*=0.7; st.hvy*=0.7;
      }
      /* 刃筋 — 切先が「刀身に対して横へ」動いた速さ。
         柄は慣性で遅れるので、弧を描くと横成分が立ち、直線で押すと軸成分になる。
         ＝ 円を描くように振れば斬れ、真っ直ぐ押せば突きにしかならない。 */
      const bl2=len(st.tipX-st.hiltX, st.tipY-st.hiltY)||1;
      const ax=(st.tipX-st.hiltX)/bl2, ay2=(st.tipY-st.hiltY)/bl2;
      const tvx=(st.tipX-(st.ptx||st.tipX))/Math.max(dt,1e-4);
      const tvy=(st.tipY-(st.pty||st.tipY))/Math.max(dt,1e-4);
      st.axial=Math.abs(tvx*ax+tvy*ay2);
      st.slice=Math.abs(tvx*(-ay2)+tvy*ax);
      /* 直近100msのピーク。振り抜きの「強さ」は当たった瞬間の1フレームでは測れない */
      st.sh.push(st.slice); if(st.sh.length>3) st.sh.shift();
      st.sliceP=Math.max.apply(null,st.sh);
      hitCheck(dt);
      st.ptx=st.tipX; st.pty=st.tipY;
    }

    st.trail.push({hx:st.hiltX,hy:st.hiltY,tx:st.tipX,ty:st.tipY,s:st.sliceP});
    if(st.trail.length>13) st.trail.shift();

    /* 納刀の入口（企画書 §10）*/
    const md=len(st.tipX-M.x, st.tipY-M.y);
    const ba=Math.atan2(st.tipY-st.hiltY, st.tipX-st.hiltX);
    const off=Math.abs(angDiff(ba,DA))*180/Math.PI;
    st.mouthNear = md<st.mod.mouth*2.5;
    st.mouthOk   = md<st.mod.mouth && off<st.mod.ang;
    if(st.mouthOk && !st.guarding){ st.mode='SHEATHING'; st.q=0; st.sheStep=0; S.chin(); }
    else if(md<st.mod.mouth && off>=st.mod.ang){
      st.bind-=dt; if(st.bind<=0){ S.katsu(); st.bind=.32; }
    }
  }

  /* --- SHEATHING：軸にロックして押し込む --- */
  else if(st.mode==='SHEATHING'){
    const rx=mouse.x-M.x, ry=mouse.y-M.y;
    const along=dot(rx,ry,dx,dy), lat=Math.abs(crs(rx,ry,dx,dy));
    if(lat>st.mod.mouth*1.18){ popOut(); }
    else{
      st.q=clamp(along/st.L,0,1);
      st.tipX=M.x+dx*st.L*st.q; st.tipY=M.y+dy*st.L*st.q;
      st.hiltX=st.tipX-dx*st.L; st.hiltY=st.tipY-dy*st.L;
      const step=Math.floor(st.q*8);
      if(step>st.sheStep){ st.sheStep=step; S.su(); }
      if(st.q>=0.995){
        st.mode='SHEATHED'; st.q=0; st.trail.length=0; st.combo=0;
        S.kachin(); shake(4); spark(M.x,M.y,8,'#ffe6b8',.5);
        say('カチン','#ffe6b0'); st.score+=40;
      }
    }
  }
}

/* 通常斬撃 — 刃筋で決まる（企画書 §8）*/
function hitCheck(dt){
  const e=st.enemy; if(!e||e.dead>0) return;
  const ey=e.y-28;
  /* 刀身そのものと、切先が通った線の両方を見る（速い振りの抜け落ち対策） */
  let d=segDist(st.hiltX,st.hiltY,st.tipX,st.tipY,e.x,ey);
  if(st.ptx) d=Math.min(d, segDist(st.ptx,st.pty,st.tipX,st.tipY,e.x,ey));
  if(d>=46) return;
  if(RT-st.cutAt<T.cutCool) return;
  const sp=st.sliceP;
  if(sp<T.slice[0].v && st.axial<900) return;
  st.cutAt=RT;

  let tier=null;
  for(const s of T.slice) if(sp>=s.v) tier=s;
  let base=st.sw.cut*st.mod.cut, tag='突き', col='#a9a294', p=0;
  if(tier){
    base*=tier.m; tag=tier.n; p=clamp((sp-560)/2400,0,1);
    col = tier.n==='強斬'?'#ffe0a8' : tier.n==='斬'?'#e2e8f0' : '#b8bec8';
    if(tier.hs>0) freeze(tier.hs);
  } else {
    base*=T.thrustMul;
  }
  st.combo++; st.comboT=T.comboWindow;
  const cm=Math.min(st.mod.comboMax, 1+st.combo*T.comboStep);
  base*=cm;

  S.cut(p); if(tier&&tier.n==='強斬') S.heavy();
  shake(2+9*p);
  spark(e.x-10,e.y-30,6+((14*p)|0),col,.7+p);
  if(p>0.3) mist(e.x-10,e.y-30,4+((8*p)|0));
  slash(st.hiltX,st.hiltY,st.tipX,st.tipY,3+9*p,col,.16);
  damage(base, tag+(st.combo>1?' ×'+st.combo:''), col, tier&&tier.n==='強斬');
  st.cuts++;
}

/* ===== ⑫ 描画 ============================================================ */
function draw(){
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#050507'; g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(dpr,0,0,dpr,0,0);

  const shx=(Math.random()-.5)*cam.sh, shy=(Math.random()-.5)*cam.sh;
  g.save();
  g.translate(ox+shx,oy+shy); g.scale(sc,sc);
  g.beginPath(); g.rect(0,0,VW,VH); g.clip();
  g.translate(cam.zx,cam.zy); g.scale(cam.zoom,cam.zoom); g.translate(-cam.zx,-cam.zy);

  const bg=st.bg||BG[0];
  drawBG(bg);
  if(st.phase!=='title'){
    drawEnemy();
    drawPlayer();
    drawSword();
  }
  drawFx();
  if(st.zan) drawZan();
  g.restore();

  g.save();
  g.translate(ox,oy); g.scale(sc,sc);
  g.beginPath(); g.rect(0,0,VW,VH); g.clip();
  if(st.phase!=='title') hud();
  g.restore();
}

function drawBG(bg){
  const sky=g.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,bg.sky[0]); sky.addColorStop(.68,bg.sky[1]); sky.addColorStop(1,bg.gr);
  g.fillStyle=sky; g.fillRect(-80,-80,VW+160,VH+160);
  /* 月 — にじみ→円盤の順。べた塗りだと汚れに見える */
  const mc=bg.mo.replace(/rgba\(([^)]+),[\d.]+\)/,'rgba($1,');
  const gl=g.createRadialGradient(1010,146,40,1010,146,270);
  gl.addColorStop(0, mc+'0.20)'); gl.addColorStop(0.34, mc+'0.07)'); gl.addColorStop(1, mc+'0)');
  g.fillStyle=gl; g.beginPath(); g.arc(1010,146,270,0,7); g.fill();
  g.fillStyle=mc+'0.30)'; g.beginPath(); g.arc(1010,146,86,0,7); g.fill();
  g.fillStyle=mc+'0.16)'; g.beginPath(); g.arc(1010,146,86,0,7); g.fill();
  /* 遠景 */
  g.fillStyle=bg.ac; g.globalAlpha=.5;
  g.beginPath(); g.moveTo(-60,GY);
  for(let x=-60;x<=VW+60;x+=70){ g.lineTo(x, GY-60-Math.sin(x*0.006)*46-Math.cos(x*0.013)*28); }
  g.lineTo(VW+60,GY); g.closePath(); g.fill();
  g.globalAlpha=1;
  if(bg.pt==='leaf'){
    g.strokeStyle=bg.ac; g.lineWidth=9;
    for(let i=0;i<11;i++){ const x=60+i*118+Math.sin(i)*30;
      g.beginPath(); g.moveTo(x,GY); g.lineTo(x+Math.sin(i*2)*22,GY-330-((i*37)%160)); g.stroke(); }
  }
  /* 地面 */
  g.fillStyle=bg.gr; g.fillRect(-60,GY,VW+120,VH-GY+60);
  g.strokeStyle='rgba(200,188,164,.16)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(-60,GY+.5); g.lineTo(VW+60,GY+.5); g.stroke();
  /* 天候 */
  for(const a of AMB){
    if(a.k==='rain'){ g.strokeStyle='rgba(170,196,214,.16)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(a.x-a.vx*0.02,a.y-a.l); g.stroke(); }
    else if(a.k==='snow'){ g.fillStyle='rgba(236,242,250,.5)'; g.beginPath(); g.arc(a.x,a.y,a.r,0,7); g.fill(); }
    else if(a.k==='leaf'){ g.save(); g.translate(a.x,a.y); g.rotate(a.a);
      g.fillStyle='rgba(150,180,140,.32)'; g.fillRect(-a.r,-a.r*0.4,a.r*2,a.r*0.8); g.restore(); }
    else { g.fillStyle='rgba(210,180,160,.22)'; g.beginPath(); g.arc(a.x,a.y,a.r,0,7); g.fill(); }
  }
  /* 常時の周辺減光 */
  const vg=g.createRadialGradient(VW/2,VH*0.46,VH*0.34,VW/2,VH*0.46,VW*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.42)');
  g.fillStyle=vg; g.fillRect(-80,-80,VW+160,VH+160);
  /* 居合構えの締まり */
  if(st.iai){
    const v=g.createRadialGradient(PX+160,PY-20,80,PX+160,PY-20,760);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,'+(st.zan?.34:.56)+')');
    g.fillStyle=v; g.fillRect(-80,-80,VW+160,VH+160);
  }
}

function shadow(x,w,a){
  g.save(); g.globalAlpha=a||.3; g.fillStyle='#000';
  g.beginPath(); g.ellipse(x,GY+3,w,w*0.20,0,0,7); g.fill(); g.restore();
}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f), g2=Math.round(((n>>8)&255)*f), b=Math.round((n&255)*f);
  return 'rgb('+r+','+g2+','+b+')';
}

/* 人のシルエット。刀を持つ娘。
   べた塗り二色（体＋髪）で輪郭だけで読ませる。
   胴と袴は1本の連続した輪郭。肩→腰でくびれ、そのまま裾へ広がる。 */
function figure(x,y,col,o){
  o=o||{};
  const crouch=o.crouch||0, lean=o.lean||0, sc2=o.sc||1;
  const tt=(o.t!==undefined?o.t:st.t)||0;
  const hair=o.hair||shade(col,0.58);
  g.save(); g.translate(x,y); g.scale(o.flip?-sc2:sc2,sc2);

  const foot=(GY-y)/(sc2||1);
  const SH=-52+crouch, WA=4+crouch*0.6, HIP=28+crouch*0.5, HEM=80+crouch*0.3;
  const hy=SH-26+crouch*0.15, hx=lean*0.9;    // 頭の中心
  const HRX=17.5, HRY=19.5;
  const sw=Math.sin(tt*1.8+(o.ph||0))*3.2;

  g.lineCap='round'; g.lineJoin='round';

  /* ===== 後ろ髪の束（体より奥）===== */
  g.fillStyle=hair;
  g.beginPath();
  g.moveTo(hx-16, hy-12);
  g.quadraticCurveTo(hx-23, hy+22, hx-19+sw*0.8, WA+6);
  g.quadraticCurveTo(hx-16+sw*1.6, HIP+16, hx-11+sw*2.1, HIP+26);
  g.quadraticCurveTo(hx-11+sw*1.3, HIP+2, hx-10, WA);
  g.quadraticCurveTo(hx-9, hy+20, hx-6, hy-10);
  g.closePath(); g.fill();

  /* ===== 脚 ===== */
  g.strokeStyle=col; g.lineWidth=6.6;
  g.beginPath();
  g.moveTo(-4,HIP+10); g.lineTo(-16, foot);
  g.moveTo(4,HIP+10);  g.lineTo(19, foot);
  g.stroke();

  /* ===== 胴＋袴を1本の輪郭で ===== */
  g.fillStyle=col;
  g.beginPath();
  g.moveTo(-13, SH+2);                                   // 左肩
  g.quadraticCurveTo(-13.5, SH+18, -8, WA);              // 腰へ絞る
  g.quadraticCurveTo(-12, HIP-6, -14, HIP+6);            // 尻へ出す
  g.bezierCurveTo(-19, HIP+26, -23, HEM-14, -25, HEM);   // 裾へ広がる
  g.quadraticCurveTo(-12, HEM+7, 0, HEM-4);              // 裾のうねり
  g.quadraticCurveTo(12, HEM+7, 25, HEM);
  g.bezierCurveTo(23, HEM-14, 19, HIP+26, 14, HIP+6);
  g.quadraticCurveTo(12, HIP-6, 8, WA);
  g.quadraticCurveTo(13.5, SH+18, 13, SH+2);
  g.quadraticCurveTo(0, SH-3, -13, SH+2);                // 肩の丸み
  g.closePath(); g.fill();

  /* 帯 */
  g.fillStyle=hair;
  g.beginPath();
  g.moveTo(-10, WA+4); g.lineTo(10, WA+4); g.lineTo(11, WA+13); g.lineTo(-11, WA+13);
  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-10,WA+13); g.lineTo(-17,WA+30); g.lineTo(-7,WA+17); g.closePath(); g.fill();

  /* ===== 首（ごく短く）===== */
  g.strokeStyle=col; g.lineWidth=9.5;
  g.beginPath(); g.moveTo(hx*0.6, SH+2); g.lineTo(hx*0.9, hy+HRY-8); g.stroke();

  /* ===== 髪のかぶり（顔より奥。頭より一回り大きい）===== */
  g.fillStyle=hair;
  g.beginPath(); g.ellipse(hx-1.5, hy-3, HRX+2, HRY+1.5, 0, 0, 7); g.fill();

  /* ===== 顔 ===== */
  g.fillStyle=col;
  g.beginPath(); g.ellipse(hx+0.5, hy+2, HRX, HRY-1, 0, 0, 7); g.fill();

  /* ===== 前髪。額だけ隠す ===== */
  g.fillStyle=hair;
  g.beginPath();
  g.moveTo(hx-HRX-1, hy);
  g.quadraticCurveTo(hx-HRX-1, hy-16, hx+2, hy-17);
  g.quadraticCurveTo(hx+HRX+1, hy-16, hx+HRX+1, hy-4);
  g.lineTo(hx+11, hy-5);
  g.quadraticCurveTo(hx+8, hy-13, hx+3, hy-6);
  g.quadraticCurveTo(hx-2, hy-14, hx-6, hy-5);
  g.quadraticCurveTo(hx-9, hy-13, hx-12, hy-3);
  g.closePath(); g.fill();

  /* 顔を挟む細い毛束。外側だけを薄く */
  g.beginPath();
  g.moveTo(hx+HRX-1, hy-8);
  g.quadraticCurveTo(hx+HRX+2, hy+8, hx+HRX-2, hy+19);
  g.quadraticCurveTo(hx+HRX-4, hy+6, hx+HRX-4, hy-7);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(hx-HRX-1, hy-8);
  g.quadraticCurveTo(hx-HRX-4, hy+11, hx-HRX, hy+24);
  g.quadraticCurveTo(hx-HRX+4, hy+8, hx-HRX+3.5, hy-7);
  g.closePath(); g.fill();

  /* アホ毛 */
  g.strokeStyle=hair; g.lineWidth=2.4;
  g.beginPath();
  g.moveTo(hx+2, hy-HRY-1);
  g.quadraticCurveTo(hx+8+sw*0.4, hy-HRY-12, hx-3+sw*0.9, hy-HRY-16);
  g.stroke();

  /* ===== 結びのリボン ===== */
  g.fillStyle=o.acc||shade(col,0.40);
  g.save(); g.translate(hx-15, hy-12); g.rotate(-0.4);
  g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(-7,-10,-13,-7); g.quadraticCurveTo(-11,0,0,0); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(-7, 10,-13, 7); g.quadraticCurveTo(-11,0,0,0); g.closePath(); g.fill();
  g.beginPath(); g.arc(0,0,2.8,0,7); g.fill();
  g.restore();

  g.restore();
}

function drawPlayer(){
  const crouch=st.iai?12:0;
  shadow(PX+4,44,.34);
  figure(PX,PY,'#e8dfcd',{crouch, acc:'#c0453a', ph:0});
  /* 腕（柄・鞘・構えを追う） */
  let ax,ay;
  if(st.mode==='SHEATHED'){ ax=st.guarding?PX+Math.cos(st.guardAng)*70:M.x-8; ay=st.guarding?PY+Math.sin(st.guardAng)*70:M.y-10; }
  else { ax=clamp(st.hiltX,PX-70,PX+340); ay=clamp(st.hiltY,PY-230,GY-6); }
  g.strokeStyle='#ddd3c1'; g.lineWidth=6; g.lineCap='round';
  g.beginPath(); g.moveTo(PX+3,PY-48+crouch); g.lineTo(ax,ay); g.stroke();
  /* 受け構えの弧 */
  if(st.guarding) drawGuardArc();
}
function drawGuardArc(){
  const sheathed=st.mode==='SHEATHED';
  const arc=(sheathed?T.guardArcSheath:T.guardArcBlade)*Math.PI/180;
  const fresh=(RT-mouse.rAt)<=st.mod.parry;
  g.save();
  g.strokeStyle=fresh?'rgba(190,230,255,.55)':'rgba(180,196,214,.22)';
  g.lineWidth=fresh?4:2.4;
  g.beginPath(); g.arc(PX,PY,T.guardPointDist,st.guardAng-arc,st.guardAng+arc); g.stroke();
  if(fresh){
    g.strokeStyle='rgba(220,242,255,.22)'; g.lineWidth=13;
    g.beginPath(); g.arc(PX,PY,T.guardPointDist,st.guardAng-arc,st.guardAng+arc); g.stroke();
  }
  g.restore();
}

function drawSheath(){
  const e=E();
  const bind = st.bind>0 && (st.mode==='DRAWING'||st.mode==='DRAWN');
  g.lineCap='round';
  g.strokeStyle='#221d19'; g.lineWidth=15;
  g.beginPath(); g.moveTo(M.x,M.y); g.lineTo(e.x,e.y); g.stroke();
  g.strokeStyle='#3b332a'; g.lineWidth=11;
  g.beginPath(); g.moveTo(M.x,M.y); g.lineTo(e.x,e.y); g.stroke();
  g.strokeStyle='#4a4038'; g.lineWidth=3;
  g.beginPath(); g.moveTo(M.x+dx*st.L*.9,M.y+dy*st.L*.9); g.lineTo(e.x,e.y); g.stroke();
  g.strokeStyle=bind?'#d1553a':(st.mouthOk?'#ffe0a0':'#7d6f5c'); g.lineWidth=3;
  g.beginPath(); g.arc(M.x,M.y,7,0,7); g.stroke();

  if(st.mode==='DRAWN'&&!st.guarding){
    const ba=Math.atan2(st.tipY-st.hiltY, st.tipX-st.hiltX);
    const okA=Math.abs(angDiff(ba,DA))*180/Math.PI < st.mod.ang;
    g.setLineDash([4,6]);
    g.strokeStyle=st.mouthNear?'rgba(255,220,150,.5)':'rgba(180,168,148,.18)';
    g.lineWidth=1.5; g.beginPath(); g.arc(M.x,M.y,st.mod.mouth,0,7); g.stroke();
    g.setLineDash([6,8]); g.lineDashOffset=st.t*30;
    g.strokeStyle=okA?'rgba(255,222,158,.55)':'rgba(150,140,124,.15)';
    g.lineWidth=okA?2.2:1.4;
    g.beginPath(); g.moveTo(M.x,M.y); g.lineTo(M.x+ux*st.L,M.y+uy*st.L); g.stroke();
    g.setLineDash([]);
    if(st.mouthNear){
      g.font='400 12px ui-monospace,monospace'; g.textAlign='center';
      g.fillStyle=okA?'#ffdc9e':'#c9705a';
      g.fillText(okA?'入る':'刃の向きが違う', M.x+ux*96-16, M.y+uy*96+28);
    }
  }
}
function tsuba(x,y,ang){
  g.save(); g.translate(x,y); g.rotate(ang);
  g.fillStyle='#3c3a34'; g.fillRect(-2.5,-12,5,24);
  g.fillStyle='#57534a'; g.fillRect(-1.5,-12,3,24); g.restore();
}
function drawSword(){
  drawSheath();
  if(st.mode==='SHEATHED'){
    g.strokeStyle='#1e2229'; g.lineWidth=9; g.lineCap='round';
    g.beginPath(); g.moveTo(M.x,M.y); g.lineTo(M.x+ux*48,M.y+uy*48); g.stroke();
    g.strokeStyle='#2b3038'; g.lineWidth=5;
    g.beginPath(); g.moveTo(M.x+ux*6,M.y+uy*6); g.lineTo(M.x+ux*44,M.y+uy*44); g.stroke();
    tsuba(M.x,M.y,Math.atan2(uy,ux));
    return;
  }
  /* 残像リボン */
  if(st.mode==='DRAWN'&&st.trail.length>2){
    for(let i=1;i<st.trail.length;i++){
      const a=st.trail[i-1], b=st.trail[i];
      if(Math.hypot(b.tx-a.tx,b.ty-a.ty)>300) continue;
      const al=(i/st.trail.length)*0.32*clamp(b.s/1400,0.14,1);
      g.fillStyle='rgba(198,224,255,'+al.toFixed(3)+')';
      g.beginPath(); g.moveTo(a.hx,a.hy); g.lineTo(a.tx,a.ty); g.lineTo(b.tx,b.ty); g.lineTo(b.hx,b.hy);
      g.closePath(); g.fill();
    }
  }
  const hx=st.hiltX, hy=st.hiltY, tx=st.tipX, ty=st.tipY;
  const bl=len(tx-hx,ty-hy)||1;
  const ang=Math.atan2(ty-hy,tx-hx);
  g.lineCap='round';
  const hot=clamp(st.sliceP/2400,0,1);
  g.strokeStyle='rgba(200,226,255,'+(0.12+0.22*hot)+')'; g.lineWidth=10+8*hot;
  g.beginPath(); g.moveTo(hx,hy); g.lineTo(tx,ty); g.stroke();
  g.strokeStyle='#e9f1fb'; g.lineWidth=3.6;
  g.beginPath(); g.moveTo(hx,hy); g.lineTo(tx,ty); g.stroke();
  g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(hx,hy); g.lineTo(tx,ty); g.stroke();
  const bx=(hx-tx)/bl, by=(hy-ty)/bl;
  g.strokeStyle='#1e2229'; g.lineWidth=9;
  g.beginPath(); g.moveTo(hx,hy); g.lineTo(hx+bx*48,hy+by*48); g.stroke();
  tsuba(hx,hy,ang);
  if(st.mode==='DRAWING'||st.mode==='SHEATHING'){
    const off=len(mouse.x-hx, mouse.y-hy);
    g.strokeStyle='rgba(230,120,80,'+clamp(off/90,0,.6).toFixed(2)+')'; g.lineWidth=1.5;
    g.setLineDash([3,4]);
    g.beginPath(); g.moveTo(hx,hy); g.lineTo(mouse.x,mouse.y); g.stroke(); g.setLineDash([]);
  }
}

function drawEnemy(){
  const e=st.enemy; if(!e) return;
  const dead=e.dead>0, a=dead?clamp(e.dead/0.9,0,1):1;
  g.save(); g.globalAlpha=a;
  if(dead){ g.translate(0,(1-a)*36); }
  const col=e.flash>0?'#fff3e0':e.def.col;
  const boss=e.def.boss;
  shadow(e.x,boss?54:44,dead?.34*a:.34);
  figure(e.x,e.y,col,{flip:true, lean:e.state==='tel'?-8:e.lean,
    sc:boss?1.14:1, ph:(e.x%7)+1, acc:boss?'#e8cfa4':undefined});

  /* 武器 */
  const drawnB = !boss || e.bmode==='DRAWN';
  if(drawnB){
    const wa = e.state==='tel' ? e.phi+Math.PI+(e.t/Math.max(e.tel,.01))*0.6 : e.phi+Math.PI+0.6;
    g.strokeStyle= e.red&&e.state==='tel' ? 'rgba(230,86,60,.85)' : 'rgba(226,216,200,.6)';
    g.lineWidth=3.4; g.lineCap='round';
    g.beginPath(); g.moveTo(e.x-8,e.y-34);
    g.lineTo(e.x-8+Math.cos(wa)*-82, e.y-34+Math.sin(wa)*-82); g.stroke();
  } else {
    g.strokeStyle='#3b332a'; g.lineWidth=11; g.lineCap='round';
    g.beginPath(); g.moveTo(e.x+8,e.y+14); g.lineTo(e.x+156,e.y-8); g.stroke();
  }
  g.restore();

  /* HP・名前 */
  const bw=boss?300:104, bx=e.x-bw/2, by=e.y-(boss?126:112);
  g.fillStyle='rgba(255,255,255,.09)'; g.fillRect(bx,by,bw,boss?7:4);
  g.fillStyle=e.def.col; g.fillRect(bx,by,bw*clamp(e.hp/e.max,0,1),boss?7:4);
  if(boss){ g.strokeStyle='rgba(232,207,164,.5)'; g.lineWidth=1; g.strokeRect(bx-1.5,by-1.5,bw+3,10); }
  g.font='400 11px ui-monospace,monospace'; g.textAlign='center'; g.fillStyle='#7a7166';
  g.fillText(e.def.n+(e.stagger>0?'　崩れ':''), e.x, by-9);

  /* 予兆と受け点 */
  if(e.state==='tel'&&!dead){
    const p=clamp(e.t/e.tel,0,1);
    const gx=PX+Math.cos(e.phi)*T.guardPointDist, gy=PY+Math.sin(e.phi)*T.guardPointDist;
    const c = e.red? '230,86,60' : '214,120,74';
    g.strokeStyle='rgba('+c+','+(0.16+0.42*p)+')'; g.lineWidth=1.5;
    g.setLineDash([7,7]); g.lineDashOffset=-st.t*46;
    g.beginPath(); g.moveTo(e.x-8,e.y-34); g.lineTo(gx,gy); g.stroke(); g.setLineDash([]);
    g.strokeStyle='rgba('+c+','+(0.4+0.5*p)+')'; g.lineWidth=2.4;
    g.beginPath(); g.arc(gx,gy,11+30*(1-p),0,7); g.stroke();
    g.beginPath(); g.arc(gx,gy,9,0,7); g.stroke();
    g.font='400 11px ui-monospace,monospace'; g.textAlign='center';
    g.fillStyle='rgba('+c+',.9)';
    g.fillText((e.red?'朱・':'')+ATT[e.kind].n, gx, gy-24);
  }
  /* ボスの居合構え */
  if(e.def.boss && e.bmode==='SHEATHED' && e.state==='iai'){
    const p=clamp(e.t/e.bwait,0,1);
    g.strokeStyle='rgba(232,207,164,'+(0.18+0.4*p)+')'; g.lineWidth=2;
    g.beginPath(); g.arc(e.x,e.y-20,60+40*(1-p),0,7); g.stroke();
    if(e.bzan){
      g.font='300 76px "Yu Mincho",serif'; g.textAlign='center';
      g.fillStyle='rgba(240,220,180,.92)'; g.fillText('抜', e.x, e.y-182);
    }
  }
}

function drawZan(){
  const a=clamp(1-(RT-st.zanAt)*1.05,0,1);
  g.save();
  g.font='300 214px "Yu Mincho","Hiragino Mincho ProN",serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba(214,58,44,'+(0.14+0.22*a)+')';
  g.fillText('斬',VW/2+3,VH/2-46);
  g.fillStyle='#f4e8d4'; g.shadowColor='rgba(226,74,52,.95)'; g.shadowBlur=46+70*a;
  g.fillText('斬',VW/2,VH/2-48);
  g.restore();
}

function drawFx(){
  g.lineCap='round';
  for(const s of SL){
    const a=s.l/s.m;
    /* 太→細を3枚重ねて、抜けていく刃の跡に見せる */
    for(let k=0;k<3;k++){
      g.globalAlpha=a*a*(0.34-k*0.09);
      g.strokeStyle=s.c; g.lineWidth=s.w*a*(1-k*0.3)+ (k===2?1:0);
      g.beginPath(); g.moveTo(s.x1,s.y1); g.quadraticCurveTo(s.cx,s.cy,s.x2,s.y2); g.stroke();
    }
    g.globalAlpha=1;
  }
  for(const p of PT){
    const a=clamp(p.l/0.5,0,1);
    if(p.soft){ g.fillStyle=p.c+(a*0.5).toFixed(3)+')'; g.beginPath(); g.arc(p.x,p.y,p.r*(2-a),0,7); g.fill(); }
    else { g.globalAlpha=a; g.fillStyle=p.c; g.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r); g.globalAlpha=1; }
  }
  g.textAlign='center';
  for(const f of FL){
    const a=clamp(f.l/0.45,0,1);
    g.globalAlpha=a;
    g.font=(f.b?'400 27px':'400 17px')+' "Yu Gothic UI",sans-serif';
    g.fillStyle='rgba(0,0,0,.55)'; g.fillText(f.t,f.x+1.5,f.y+1.5);
    g.fillStyle=f.c; g.fillText(f.t,f.x,f.y);
    g.globalAlpha=1;
  }
}

/* ===== ⑬ HUD ============================================================= */
function hud(){
  const m=st.mod;
  g.textAlign='left'; g.textBaseline='alphabetic';
  /* HP */
  g.fillStyle='rgba(255,255,255,.08)'; g.fillRect(26,26,258,9);
  g.fillStyle=st.hp/st.maxhp<0.3?'#c9603f':'#c8b48c'; g.fillRect(26,26,258*clamp(st.hp/st.maxhp,0,1),9);
  g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1; g.strokeRect(25.5,25.5,259,10);
  g.font='400 11px ui-monospace,monospace'; g.fillStyle='#6f675d';
  g.fillText(Math.ceil(st.hp)+' / '+st.maxhp, 26, 52);

  /* 状態 */
  const modeJ={SHEATHED:'納刀',DRAWING:'抜刀中',DRAWN:'抜刀',SHEATHING:'納刀中'}[st.mode];
  g.font='300 30px "Yu Mincho",serif';
  g.fillStyle=st.mode==='SHEATHED'?'#e8dcc0':'#93bcdd';
  g.fillText(modeJ,26,92);
  g.font='400 11px ui-monospace,monospace'; g.fillStyle='#5f584e';
  g.fillText(st.mode==='SHEATHED'?'居合 可 ／ 鞘で受けられる（広い）':'居合 不可 ／ 刃受けは狭い ／ 被害 +25%',26,112);

  /* 居合ゲージ */
  if(st.iai&&!st.zan){
    const w=232, p=clamp(st.iaiT/Math.max(st.iaiWait,.01),0,1);
    const lo=clamp(m.waitMin/Math.max(m.waitMax,.01),0,1);
    g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(26,126,w,7);
    g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(26+w*lo,126,w*(1-lo),7);
    g.fillStyle='#8a6f4a'; g.fillRect(26,126,w*p,7);
    g.font='400 10px ui-monospace,monospace'; g.fillStyle='#6d6355';
    g.fillText('斬 待機　'+Math.max(0.6,m.waitMin).toFixed(1)+'–'+Math.max(1,m.waitMax).toFixed(1)+'s',26,148);
    if(RT-st.parryAt<T.parryIaiWindow){ g.fillStyle='#9fd0ff'; g.fillText('後の先（待機短縮）',150,148); }
  }
  /* 連撃 */
  if(st.combo>1){
    const cm=Math.min(m.comboMax,1+st.combo*T.comboStep);
    g.textAlign='left'; g.font='300 40px "Yu Mincho",serif';
    g.fillStyle='rgba(255,224,168,'+clamp(st.comboT/T.comboWindow,.25,1)+')';
    g.fillText(st.combo+'　連', 26, 200);
    g.font='400 11px ui-monospace,monospace'; g.fillStyle='#8a7f6a';
    g.fillText('×'+cm.toFixed(2), 26, 218);
  }

  /* 右上 */
  g.textAlign='right';
  const stg=RUN[st.stage];
  g.font='300 21px "Yu Mincho",serif'; g.fillStyle='#cfc4b2';
  g.fillText('第'+stg.s+'面　'+stg.n, VW-26, 44);
  g.font='400 11px ui-monospace,monospace'; g.fillStyle='#5f584e';
  g.fillText(st.sw.name+'　'+(st.fight+1)+' / '+stg.fights.length+'　撃破 '+st.kills, VW-26, 64);
  if(st.best) g.fillText('最速 '+st.best.toFixed(3)+'s（'+st.bestTier+'）', VW-26, 82);
  g.fillText('得点 '+st.score, VW-26, 100);
  /* 取った強化 */
  g.font='400 10px ui-monospace,monospace'; g.fillStyle='#6a6156';
  m.taken.slice(-9).forEach((u,i)=>g.fillText(u,VW-26,124+i*15));

  /* 面バナー */
  if(st.bannerT>0){
    const a=clamp(st.bannerT/0.6,0,1)*clamp((2.4-st.bannerT)/0.35,0,1);
    g.textAlign='center'; g.globalAlpha=a;
    g.font='300 46px "Yu Mincho",serif'; g.fillStyle='#eadfc9';
    g.fillText(st.banner, VW/2, 176);
    g.font='400 12px ui-monospace,monospace'; g.fillStyle='#8a7f70';
    if(st.enemy) g.fillText(st.enemy.def.note, VW/2, 204);
    g.globalAlpha=1;
  }
  /* メッセージ */
  if(st.msgT>0){
    g.textAlign='center'; g.globalAlpha=clamp(st.msgT/0.5,0,1);
    g.font='300 29px "Yu Mincho",serif'; g.fillStyle=st.msgC;
    g.fillText(st.msg,VW/2,258); g.globalAlpha=1;
  }
  /* 介錯線 */
  if(st.guide&&(st.mode==='SHEATHED'||st.mode==='DRAWING')&&!st.guarding){
    const bx=st.mode==='DRAWING'?st.grabX:mouse.x, by=st.mode==='DRAWING'?st.grabY:mouse.y;
    g.setLineDash([5,8]); g.lineDashOffset=-st.t*26;
    g.strokeStyle='rgba(200,180,140,.22)'; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+ux*st.L,by+uy*st.L); g.stroke();
    g.strokeStyle='rgba(200,180,140,.09)';
    for(const s2 of[-1,1]){
      g.beginPath();
      g.moveTo(bx-uy*m.lat*s2, by+ux*m.lat*s2);
      g.lineTo(bx+ux*st.L-uy*m.lat*s2, by+uy*st.L+ux*m.lat*s2);
      g.stroke();
    }
    g.setLineDash([]);
  }
  /* カーソル */
  g.strokeStyle=st.mode==='DRAWN'?'rgba(232,240,250,.9)':'rgba(200,186,160,.75)';
  g.lineWidth=1.2;
  g.beginPath(); g.arc(mouse.x,mouse.y,st.mode==='DRAWN'?3:6,0,7); g.stroke();
  if(st.mode!=='DRAWN'){
    g.beginPath();
    g.moveTo(mouse.x-11,mouse.y); g.lineTo(mouse.x-6,mouse.y);
    g.moveTo(mouse.x+6,mouse.y);  g.lineTo(mouse.x+11,mouse.y); g.stroke();
  }
  /* 足元 */
  g.textAlign='center'; g.font='400 11px ui-monospace,monospace'; g.fillStyle='#4b453d';
  const hint = st.mode==='SHEATHED' ? 'SPACE 居合構え　／　右ドラッグで鞘受け（押した瞬間が弾き）　／　左ドラッグで抜刀'
             : st.mode==='DRAWN'    ? '刀を横へ払え＝刃筋　／　右クリックで刃受け　／　切先を鯉口へ戻して押し込む'
             : st.mode==='DRAWING'  ? '鞘の線から外れるな'
             : '押し込み '+Math.round(st.q*100)+'%';
  g.fillText(hint,VW/2,VH-26);
  g.fillText('G 介錯線　R 再挑戦',VW/2,VH-10);
}

/* ===== ⑭ 画面（タイトル・強化・結果）===================================== */
function hideScreen(){ scrEl.classList.add('off'); }
function showScreen(html){ scrEl.innerHTML=html; scrEl.classList.remove('off'); }

function showTitle(){
  st.phase='title'; st.bg=BG[0]; ambInit();
  const cards=T.swords.map((s,i)=>
    `<div class="card" data-sw="${i}"><h2>${s.name}</h2><div class="d">${s.d.join('<br>')}</div>
     <div class="txt" style="margin-top:9px">${s.txt}</div></div>`).join('');
  showScreen(`
    <div><h1>抜刀</h1><div class="tag">抜け。斬れ。納めろ。</div></div>
    <p>
      <span class="k">SPACE長押し</span> 居合構え　→　<b>「斬」</b>が出たら
      <span class="k">左ドラッグ</span>で鞘の線に沿って一気に引き抜く<br>
      抜いたら<b>マウス＝切先</b>。<b>刀を横へ払った速さ（刃筋）</b>で斬れ方が変わる<br>
      <span class="k">右クリック</span>で受け。<b>押した瞬間に当たれば「弾き」</b>——無傷で敵が崩れ、次の居合が早く来る<br>
      斬ったら<b>切先を鯉口へ戻し、鞘の線に沿って押し込む</b> → カチン
    </p>
    <div class="cards">${cards}</div>
    <div class="hint">全5面＋果たし合い。戦うたびに強化をひとつ選ぶ。<br>
      納刀していないと居合は撃てない。刀が鞘に入っている状態のほうが強い。</div>
    <div class="go">刀を選べ</div>`);
  scrEl.querySelectorAll('.card').forEach(el=>{
    el.onclick=()=>{ ac(); S.ui(); newRun(+el.dataset.sw); };
  });
}

function showUpgrade(){
  const pool=[...UP].sort(()=>Math.random()-.5).slice(0,3);
  const stg=RUN[st.stage];
  const cards=pool.map((u,i)=>
    `<div class="card up" data-up="${i}"><h2>${u.n}</h2><div class="txt">${u.t}</div></div>`).join('');
  showScreen(`
    <div><h1 style="font-size:42px">強化</h1>
      <div class="tag">次は 第${stg.s}面 ${stg.n}</div></div>
    <div class="cards">${cards}</div>
    <div class="stat">残 HP <b>${Math.ceil(st.hp)}</b> / ${st.maxhp}　　撃破 <b>${st.kills}</b>　　得点 <b>${st.score}</b></div>
    <div class="go">ひとつ選べ</div>`);
  scrEl.querySelectorAll('.card').forEach(el=>{
    el.onclick=()=>{
      const u=pool[+el.dataset.up];
      const before=st.mod.hp;
      u.f(st.mod); st.mod.taken.push(u.n);
      if(st.mod.hp>before){ st.maxhp=st.mod.hp; st.hp=Math.min(st.mod.hp,st.hp+(st.mod.hp-before)); }
      S.kachin(); st.phase='fight'; startFight(); ambInit(); hideScreen();
    };
  });
}

function showResult(){
  const win=st.phase==='clear';
  const sec=(RT-st.startRT);
  showScreen(`
    <div><h1 style="font-size:52px">${win?'完':'斬死'}</h1>
      <div class="tag">${win?'果たし合いを制した':'第'+RUN[st.stage].s+'面で倒れた'}</div></div>
    <div class="stat">
      得点 <b>${st.score}</b>　　撃破 <b>${st.kills}</b>　　時間 <b>${sec.toFixed(1)}s</b><br>
      居合 <b>${st.iaiHits}</b>　　斬撃 <b>${st.cuts}</b>　　弾き <b>${st.parries}</b>　　被弾 <b>${st.dmgTaken}</b><br>
      最速の抜刀 <b>${st.best?st.best.toFixed(3)+'s（'+st.bestTier+'）':'—'}</b><br>
      刀 <b>${st.sw.name}</b>　　強化 ${st.mod.taken.length?st.mod.taken.join('・'):'なし'}
    </div>
    <div class="cards" style="max-width:420px">
      <div class="card up" id="again"><h2>もう一度</h2><div class="txt">同じ刀で最初から</div></div>
      <div class="card up" id="back"><h2>刀を選び直す</h2><div class="txt">タイトルへ戻る</div></div>
    </div>
    <div class="go">R でもう一度</div>`);
  scrEl.querySelector('#again').onclick=()=>{S.ui(); newRun(st.swordIdx);};
  scrEl.querySelector('#back').onclick =()=>{S.ui(); showTitle();};
}

/* ===== ⑮ 起動 ============================================================ */
let last=performance.now();
function frame(now){
  let raw=(now-last)/1000; last=now;
  raw=Math.min(raw,1/20);
  RT+=raw;
  if(slowT>0) slowT-=raw;
  const ts = slowT>0? slowS : 1;
  if(hitstop>0) hitstop-=raw;
  else update(raw*ts);
  draw();
  requestAnimationFrame(frame);
}
st.bg=BG[0]; ambInit(); showTitle();
requestAnimationFrame(frame);
</script>
